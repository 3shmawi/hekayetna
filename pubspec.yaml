name: family_stories
description: "Preserve family stories in the voices of the people who lived them. Arabic RTL and English, private by default."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  record: ^7.2.0
  # Android foreground service so recording survives the screen locking
  # (spec 02). Exact pin per spec; 11.0.3 was published 2026-09-07.
  flutter_foreground_task: 11.0.3
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_screenutil: ^5.9.3
  go_router: ^18.1.4
  in_app_review: ^2.0.12
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  posthog_flutter: ^5.61.3
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  qr_flutter: 4.1.0
  share_plus: 13.3.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  flutter_native_splash: ^2.4.7
  flutter_flavorizr: ^2.6.0

flutter:
  assets:
    - assets/fonts/Inter/LICENSE.txt
    - assets/fonts/Cairo/LICENSE.txt
    - assets/fonts/PlusJakartaSans/LICENSE.txt
    - assets/fonts/PlayfairDisplay/LICENSE.txt
    - assets/prompts/prompts.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-700.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-700.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-700.ttf
          weight: 700
  generate: true
  uses-material-design: true
